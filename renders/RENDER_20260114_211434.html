        :root {
            --bg-page: #ffffff;

            --text-primary: #0d0d0d;
            --font-sans: "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html[data-theme="dark"] {
            --bg-page: #0f0f10;
            /* ChatGPT Dark */
            --text-primary: #e5e7eb;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s;
        }

        .container {
            max-width: 48rem;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 0.85em;
            z-index: 100;
        }

        html[data-theme="dark"] .theme-toggle {
            background: #1f2937;
            border-color: #374151;
            color: white;
        }

        /* Metadata banner */
        .metadata {
            font-size: 0.8em;
            color: #9ca3af;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #374151;
            font-family: sans-serif;
        }

        /* Ensure frozen styles aren't squashed */
        .container * {
            box-sizing: border-box;
        }
    </style>
</head>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            if (current === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }
