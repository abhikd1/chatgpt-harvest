<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .capture-btn {
            background: #4CAF50;
            color: white;
        }

        .capture-btn:hover {
            background: #45a049;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .version-badge {
            font-size: 10px;
            color: #999;
            text-align: right;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h3>🎨 Render Capture</h3>
    <button class="capture-btn" id="captureBtn">📸 Capture Selection / Response</button>
    <div id="status" class="status"></div>
    <div class="version-badge">v1.1 SOURCE-FIX</div>

    <script src="popup.js"></script>
</body>

</html>
