<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lossless Capture Viewer</title>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
    <style>
        :root {
            --bg-page: #ffffff;
            --text-primary: #0d0d0d;
            --text-secondary: #6b7280;
            --code-bg: #f9fafb;
            --code-text: #111827;
            --inline-code-bg: #f3f4f6;
            --border-color: #e5e7eb;
            --font-sans: "Söhne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        html[data-theme="dark"] {
            --bg-page: #0f0f10;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --code-bg: #111827;
            --code-text: #e5e7eb;
            --inline-code-bg: #1f2937;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 48rem;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            min-height: 100vh;
        }

        p,
        ul,
        ol,
        blockquote,
        table,
        pre {
            margin-bottom: 1.5rem;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        strong {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.75;
            color: var(--text-primary);
        }

        pre {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 12px 14px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        code {
            font-family: var(--font-mono);
            font-size: inherit;
        }

        :not(pre)>code {
            background-color: var(--inline-code-bg);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.95em;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            border: 1px solid var(--border-color);
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: var(--code-bg);
            font-weight: 600;
        }

        .control-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 14px;
            transition: all 0.2s;
            background: var(--bg-page);
        }

        .control-btn:hover {
            background: var(--inline-code-bg);
        }

        .save-btn {
            border-color: #10b981;
            color: #10b981;
        }

        .delete-btn:hover {
            border-color: #ef4444;
            background: #fee2e2;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 8px 16px;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.8em;
            z-index: 1000;
        }

        .editing {
            outline: 2px solid #3b82f6;
            padding: 10px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.05);
        }
    </style>
</head>

<body>
    <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
    <div class="container">
        {{CONTENT_PLACEHOLDER}}
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            if (current === 'dark') {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        async function editEntry(id) {
            const entry = document.getElementById(id);
            const content = entry.querySelector('.content');
            content.contentEditable = true;
            content.classList.add('editing');
            entry.querySelector('.edit-btn').style.display = 'none';
            entry.querySelector('.save-btn').style.display = 'inline-block';
            content.focus();
        }

        async function saveEntry(id) {
            const entry = document.getElementById(id);
            const content = entry.querySelector('.content');
            const newHtml = content.innerHTML;

            const response = await fetch('/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, html: newHtml })
            });

            if (response.ok) {
                content.contentEditable = false;
                content.classList.remove('editing');
                entry.querySelector('.edit-btn').style.display = 'inline-block';
                entry.querySelector('.save-btn').style.display = 'none';
            } else {
                alert('Failed to save changes.');
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Are you sure you want to delete this entry?')) return;

            const response = await fetch('/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            });

            if (response.ok) {
                document.getElementById(id).remove();
            } else {
                alert('Failed to delete entry.');
            }
        }
    </script>
</body>

</html>
